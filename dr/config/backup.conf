# =============================================================================
# Backup & Disaster Recovery configuration
# Sourced by dr/lib/common.sh. Override any variable via environment.
# =============================================================================

# --- Database ----------------------------------------------------------------
DB_TYPE=postgres            # postgres | mysql
DB_HOST=localhost
DB_PORT=5432
DB_USER=postgres
DB_NAME=appdb               # space-separated list of DBs also allowed
PGDUMP_OPTS="--no-owner --no-privileges --format=custom"

# --- Config backup sources -----------------------------------------------------
# Space-separated list of files/dirs to back up (must exist)
CONFIG_SOURCES=(
  "/etc/nginx"
  "/etc/systemd/system"
  "/home/user/testing/.env"
  "/home/user/testing/dr/config"
)

# --- Retention (days / counts) -------------------------------------------------
RETENTION_DAILY=7        # keep 7 daily backups
RETENTION_WEEKLY=5       # keep 5 weekly backups
RETENTION_MONTHLY=12     # keep 12 monthly backups
RETENTION_CONFIG=30      # keep 30 days of config snapshots
RETENTION_VERIFY=14      # keep 14 days of verification artifacts

# --- Notifications ---------------------------------------------------------------
# ALERT_WEBHOOK_URL=https://hooks.slack.com/services/XXX/YYY/ZZZ
# ALERT_EMAIL=ops@example.com

# --- Verification -----------------------------------------------------------------
# Restore the latest daily backup into a scratch DB to validate restorability
VERIFY_SCRATCH_DB="${VERIFY_SCRATCH_DB:-dr_verify_tmp}"
VERIFY_PG_PORT="${VERIFY_PG_PORT:-5433}"

# --- Remote replication (optional) --------------------------------------------------
# Offsite copy of finished backups. rsync-style destination, e.g.
#   "backup@offsite:/srv/backups/dr"
# OFFSITE_DEST=
# OFFSITE_SSH_OPTS="-o StrictHostKeyChecking=accept-new"
