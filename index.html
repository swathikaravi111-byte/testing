<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Code Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="login-container">
    <form id="login-form" class="login-card" novalidate>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="you@example.com" required />
        <span class="error" data-error-for="email"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" placeholder="••••••••" required minlength="8" />
        <span class="error" data-error-for="password"></span>
      </div>

      <div class="row-between">
        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Sign In</button>

      <p class="error banner" id="form-error" role="alert" hidden></p>

      <p class="footer-text">Don't have an account? <a href="#" class="link">Sign up</a></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
