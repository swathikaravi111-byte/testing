<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronos — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a227;
      --gold-light: #e6c55c;
      --dark: #121212;
      --dark-2: #1c1c1c;
      --text: #f5f5f0;
      --muted: #9a9a93;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--dark-2);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Watch face icon */
    .watch-face {
      width: 32px;
      height: 32px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      position: relative;
    }
    .watch-face::before,
    .watch-face::after {
      content: '';
      position: absolute;
      background: var(--gold);
      left: 50%;
      transform-origin: bottom center;
    }
    .watch-face::before { /* hour hand */
      width: 2px; height: 8px;
      top: 6px; margin-left: -1px;
      transform: rotate(45deg);
    }
    .watch-face::after { /* minute hand */
      width: 2px; height: 11px;
      top: 3px; margin-left: -1px;
      transform: rotate(180deg);
    }

    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      cursor: pointer;
    }

    .row input[type='checkbox'] {
      width: auto;
      accent-color: var(--gold);
      padding: 0;
    }

    .row a {
      color: var(--gold-light);
      text-decoration: none;
    }
    .row a:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), #a8861a);
      border: none;
      border-radius: 10px;
      color: #141414;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .btn:hover { filter: brightness(1.1); }
    .btn:active { transform: scale(0.98); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #333;
    }

    .social {
      display: flex;
      gap: 12px;
    }

    .social button {
      flex: 1;
      padding: 11px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    .social button:hover {
      border-color: var(--gold);
      background: #2a2a2a;
    }

    .signup {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: var(--muted);
    }

    .signup a {
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 500;
    }
    .signup a:hover { text-decoration: underline; }

    .error {
      display: none;
      background: rgba(220, 60, 60, 0.12);
      border: 1px solid rgba(220, 60, 60, 0.4);
      color: #ff8a8a;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .error.visible { display: block; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="brand-name">
    <div class="brand">
      <div class="brand-logo">
        <div class="watch-face" role="img" aria-label="Watch icon"></div>
      </div>
      <h1 id="brand-name">Chronos</h1>
      <p>Timepieces worth every second</p>
    </div>

    <form id="login-form" novalidate>
      <div class="error" id="error" role="alert"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required />
      </div>

      <div class="row">
        <label><input type="checkbox" name="remember" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="divider">or continue with</div>

    <div class="social">
      <button type="button" onclick="alert('Google sign-in is not configured in this demo.')">Google</button>
      <button type="button" onclick="alert('Apple sign-in is not configured in this demo.')">Apple</button>
    </div>

    <p class="signup">New to Chronos? <a href="#">Create an account</a></p>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      // Demo only — a real implementation posts to a server endpoint.
      alert('Signed in as ' + email + ' (demo — no backend connected).');
      form.reset();
    });

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }
  </script>
</body>
</html>
